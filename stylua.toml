# StyLua config — matches the existing KOReader-style codebase.
# Target: LuaJIT / Lua 5.1 (KOReader's runtime).
syntax = "Lua51"
column_width = 120
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"
