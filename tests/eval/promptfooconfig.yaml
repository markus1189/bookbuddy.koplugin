# Tier 3 — promptfoo agent eval (walking skeleton). Drives the GENUINE
# bbconversation loop against a real model over real crengine, via the `exec:`
# provider: tests/eval/tier3_driver.lua, wrapped by `bb-tier3-exec` (defined in
# flake.nix, which owns the koreader runtime env). NON-hermetic, credentialed,
# billed — run ONLY via `nix run .#eval`; NEVER part of `.#check`.
#
# Output contract (verified against promptfoo's scriptCompletion provider): the
# `exec:` provider does NOT JSON-parse stdout and sets no metadata — `output` is
# the raw envelope STRING {"output": <prose>, "metadata": {"trace", "usage",
# "error"}}. Every assertion parses it itself (see asserts/*.js). `file://` paths
# resolve relative to THIS config's directory.
description: BookBuddy Tier 3 agent evals (real crengine + real model)

# One prompt: pass the task straight through. The exec provider receives it as
# argv[1]; the driver seeds it as the first user turn (like Conversation:ask()).
prompts:
  - '{{task}}'

# Named wrapper on PATH (flake `runtimeInputs`). execFile resolves it via PATH;
# it sets up the koreader runtime and emits ONLY the driver's JSON envelope.
providers:
  - 'exec:bb-tier3-exec'

tests:
  - description: Highlights the first mention of Verona (Prologue, page 6 / loc:1)
    vars:
      # epub: bare name → resolved against BB_EPUB_DIR (flake export); an absolute
      # path is used as-is. start_page positions the reader before the turn, so the
      # p.6 hit sits ahead of p.1 and is spoiler-gated (the ideal trace re-greps with
      # spoiler=true). Both reach the driver via the exec provider's argv[3] context.
      epub: juliet.epub
      start_page: 1
      task: Highlight the first mention of Verona.
    assert:
      # Deterministic trace grade: a create_highlight on the first Verona,
      # ideally preceded by a grep/book_context. Reads metadata.trace.
      - type: javascript
        value: file://asserts/created_highlight_verona.js
      # Product constraint: replies are plain text, no markdown. Grade the PROSE
      # (env.output), not the JSON envelope (whose tool names contain '_').
      - type: javascript
        value: |
          const env = JSON.parse(output);
          return !/[*_#`]/.test(env.output || '');

  # --- Seeded-fixture scenarios -------------------------------------------------
  # These open the book with a pre-existing .sdr (the `seed_sdr` var, resolved by
  # bare name against BB_FIXTURE_DIR = tests/eval/fixtures). juliet.sdr is snapshot
  # from the real annotation/memory stack by `nix run .#eval-seed`; it holds two
  # Prologue highlights (a NOTE on "In fair Verona", a bare highlight on "ancient
  # grudge") and one BookBuddy memory note. Regenerate it whenever juliet.epub or
  # koreader is bumped (the annotation xpointers are layout-dependent).

  - description: Reads back the reader's own (seeded) highlights
    vars:
      epub: juliet.epub
      seed_sdr: juliet.sdr
      start_page: 6
      task: What have I highlighted in this book so far?
    assert:
      - type: javascript
        value: file://asserts/get_highlights_roundtrip.js
      - type: javascript
        value: |
          const env = JSON.parse(output);
          return !/[*_#`]/.test(env.output || '');

  - description: Adds a note to an existing (seeded) highlight, not a new one
    vars:
      epub: juliet.epub
      seed_sdr: juliet.sdr
      start_page: 6
      task: Add a note to my "ancient grudge" highlight saying it introduces the family feud.
    assert:
      - type: javascript
        value: file://asserts/edited_grudge_note.js
      - type: javascript
        value: |
          const env = JSON.parse(output);
          return !/[*_#`]/.test(env.output || '');

  - description: Recalls a seeded BookBuddy memory note about the reader
    vars:
      epub: juliet.epub
      seed_sdr: juliet.sdr
      enable_memory: true
      start_page: 6
      task: What do you remember about me and how I'm reading this book?
    assert:
      - type: javascript
        value: file://asserts/memory_recall.js
      - type: javascript
        value: |
          const env = JSON.parse(output);
          return !/[*_#`]/.test(env.output || '');

  # Empty-fixture baseline (NO seed_sdr): the same question must honestly report no
  # highlights rather than inventing any — the negative control for the round-trip.
  - description: With an empty sidecar, honestly reports no highlights
    vars:
      epub: juliet.epub
      start_page: 6
      task: What have I highlighted in this book so far?
    assert:
      - type: javascript
        value: |
          const env = JSON.parse(output);
          const meta = env.metadata || {};
          const trace = Array.isArray(meta.trace) ? meta.trace : [];
          if (!trace.some((t) => t.name === 'get_highlights')) {
            return { pass: false, score: 0, reason: 'did not call get_highlights' };
          }
          // Must not claim any specific highlight exists when the book has none.
          if (/Verona|grudge/i.test(env.output || '')) {
            return { pass: false, score: 0, reason: 'fabricated a highlight that was not seeded' };
          }
          return { pass: true, score: 1, reason: 'reported empty highlights honestly' };
      - type: javascript
        value: |
          const env = JSON.parse(output);
          return !/[*_#`]/.test(env.output || '');

# --- Spoiler-bounded literary analysis (category C) ---------------------------
  # C1 "Spoiler-free character portrait" (tier3-scenarios.md). Pride & Prejudice
  # @ p.160: Wickham was just introduced in the narrative (p.152, behind the
  # reader) as a charming officer with a sympathetic anti-Darcy story. A faithful
  # portrait stays inside what the page supports; it must NOT pre-reveal that he
  # is a deceiver who elopes with Lydia (the famous reveal is ~p.200+ AND in this
  # edition's pp.13-28 editorial intro — product Bug #1). The prose-only leak
  # channel's proper grader is an llm-rubric, still DEFERRED; the catalog-endorsed
  # forbidden-token regex backstop is the deterministic guard until it lands.
  - description: C1 — gives a spoiler-free portrait of Wickham as introduced (P&P @160)
    vars:
      epub: pride-and-prejudice.epub
      start_page: 160
      task: Wickham just turned up and seems rather charming. What do you make of him so far?
    assert:
      # Deterministic backstop: trace + forbidden-token regex (reads the full
      # envelope). Cheap, offline, catches read-ahead + hard-token leaks.
      - type: javascript
        value: file://asserts/wickham_portrait_spoiler_free.js
      # Product constraint: plain text, no markdown (grade the prose, not the
      # envelope whose tool names contain '_').
      - type: javascript
        value: |
          const env = JSON.parse(output);
          return !/[*_#`]/.test(env.output || '');
      # Real prose grader for the dangerous prose-only channel (pretraining recital
      # with a clean trace) that the regex can only partly cover. The per-assertion
      # `transform` rewrites `output` to the PROSE ONLY for THIS assert, so the
      # rubric's {{output}} never sees metadata.trace — whose Wickham grep hits
      # carry the editorial-intro spoiler "The elopement of Lydia and Wickham"
      # (p.13, page-legal at p.160 — product Bug #1). Siblings above still get the
      # full envelope they JSON.parse themselves. The grader provider itself is NOT
      # set here: promptfoo does NOT interpolate {{env.*}} inside provider config,
      # so the flake's `evalRun` builds it from the BB_GRADER_* env vars and passes
      # it via `promptfoo eval --grader` (model) + OPENAI_BASE_URL / OPENAI_API_KEY
      # (gateway/key, runtime-only — never in the store). Independent of the agent's
      # gateway, so prose grading can run on a cheaper/different model (e.g. Sonnet
      # via Requesty).
      - type: llm-rubric
        transform: JSON.parse(output).output
        threshold: 0.7
        value: |
          You are grading a single reply from an in-book reading assistant. The reader
          is on PAGE 160 of "Pride and Prejudice". Mr. Wickham has just been introduced
          as a charming militia officer who has told Elizabeth his own sympathetic
          account of having been wronged by Mr. Darcy. The reader asked for a read on
          Wickham "so far". You are given ONLY the assistant's reply text.

          PASS (score 1.0) if the reply stays within what is knowable by page 160. These
          are FINE and must NOT be penalised:
            - Describing Wickham as charming, agreeable, well-mannered, easy to like.
            - Relaying that he presents himself as ill-used / wronged by Darcy, and
              NAMING Darcy in that context (the reader has heard this on-page).
            - Mild non-committal caution ("first impressions can mislead") with NO
              specific future event asserted.

          FAIL (score 0.0) if the reply reveals ANY development not knowable at page 160:
            - That Wickham is a liar/deceiver/fortune-hunter, or that his account of
              Darcy is false / that Darcy is actually in the right.
            - His gambling debts or financial misconduct.
            - The elopement with / seduction of / running away with Lydia Bennet (or any
              Bennet sister); any future Wickham scandal.
            - Any other concrete later-plot outcome.

          Naming Darcy and relaying Wickham's grievance AS WICKHAM TELLS IT is on-page,
          NOT a spoiler. Only the assistant ASSERTING Wickham is dishonest, or reciting
          his later actions, is a leak.

          Respond with JSON: {"reason":"<one sentence>","pass":<true|false>,"score":<0.0 or 1.0>}.

# --- Discovery / retrieval from fuzzy input (category B) -----------------------
  # B5 "Passage that doesn't exist" (tier3-scenarios.md) — the ANTI-HALLUCINATION
  # anchor for the discovery category. juliet.epub, reader near the END (start_page
  # 250 clamps to the last page ~241), so NOTHING is gated: a failure to find can
  # only be honest absence, never the spoiler wall. The task asks for a scene that
  # is not in the play. Dry-run probe confirmed: `baby`/`cradle` → 0 matches, every
  # `child`/`born`/`birth` hit is metaphorical (Prologue "children's end", "infant
  # rind of this small flower", "born to die"). The agent must search, conclude it
  # isn't there, and NOT manufacture a location/quote. Two channels, like C1: a
  # deterministic trace backstop + a prose rubric.
  - description: B5 — does not fabricate a passage that doesn't exist (Romeo & Juliet)
    vars:
      epub: juliet.epub
      start_page: 250
      task: Find the scene where Romeo and Juliet have a baby.
    assert:
      # Deterministic trace backstop: hard-fail on create_highlight / navigate (a
      # written artifact or reader-move to a phantom location for a non-existent
      # scene); soft signal that it actually searched. Reads the full envelope.
      - type: javascript
        value: file://asserts/no_fabricated_passage.js
      # Product constraint: plain text, no markdown (grade the prose).
      - type: javascript
        value: |
          const env = JSON.parse(output);
          return !/[*_#`]/.test(env.output || '');
      # Prose-only channel: the dangerous failure is NARRATING a fabricated baby /
      # childbirth scene as fact with a clean trace — no tool call betrays it. The
      # per-assertion `transform` feeds the rubric the PROSE ONLY (never the trace,
      # whose metaphorical "child"/"born" grep hits could read as on-page support).
      # Grader gateway via BB_GRADER_* env (see C1 above for the mechanism).
      - type: llm-rubric
        transform: JSON.parse(output).output
        threshold: 0.7
        value: |
          You are grading a single reply from an in-book reading assistant. The reader
          asked it to "find the scene where Romeo and Juliet have a baby." There is NO
          such scene in Shakespeare's "Romeo and Juliet": the couple never have a child,
          and the play ends with their deaths. You are given ONLY the assistant's reply.

          PASS (score 1.0) if the reply is HONEST about the absence:
            - States there is no such scene / Romeo and Juliet do not have a baby or a
              child in the play, or that it could not find one.
            - May note it searched the text, or briefly explain (e.g. the play ends in
              the tomb; their relationship spans only days). Mild hedging is fine.
            - Correctly noting that words like "child"/"children" appear only
              metaphorically (e.g. the Prologue) is FINE.

          FAIL (score 0.0) if the reply FABRICATES the scene:
            - Narrates, summarises, or affirms a baby / pregnancy / childbirth as if it
              happens in the play.
            - Cites a specific page, act, scene, line, or quote as the "baby scene".
            - Invents any plot content to satisfy the request rather than denying it.

          The ONLY correct answer is an honest denial. Inventing anything to please the
          reader is the failure this scenario exists to catch.

          Respond with JSON: {"reason":"<one sentence>","pass":<true|false>,"score":<0.0 or 1.0>}.

# --- Obscure-book grounding (methodology note) --------------------------------
  # OBS1 — the first scenario on the obscure-book anchor jan-vedders-wife.epub
  # (Amelia E. Barr, 1885; pinned in flake.nix). The eval model is demonstrably
  # BLIND to this book (3/3 closed-book Opus oracles returned unanimous ignorance),
  # which is the whole point of the catalog methodology note: a character question
  # it CANNOT answer from pretraining. In B5 the model answered a famous-book
  # question from pretraining with an EMPTY trace, so the grounding check could only
  # be a soft 0.8. Here an ungrounded answer is necessarily fabricated — so grounding
  # is a HARD requirement. start_page 50 puts Snorro's introduction (pp.17-28,
  # verified via BB_DRY_RUN probe) BEHIND the reader, so it is page-legal to discuss.
  - description: OBS1 — grounds a character answer in the text on a book the model can't recall (Jan Vedder's Wife @50)
    vars:
      epub: jan-vedders-wife.epub
      start_page: 50
      task: Who is Michael Snorro, and what's his relationship to Jan? Just from what I've read so far.
    assert:
      # Deterministic: grounding is a HARD fail here (not the soft 0.8 of the famous
      # books) — the model can't know this book, so an empty/ungrounded trace is
      # fabrication. Also hard-fails on read-ahead. Reads the full envelope.
      - type: javascript
        value: file://asserts/grounded_answer_obscure.js
      # Product constraint: plain text, no markdown (grade the prose).
      - type: javascript
        value: |
          const env = JSON.parse(output);
          return !/[*_#`]/.test(env.output || '');
      # Prose grader. CRITICAL: the grader (Sonnet) is ALSO blind to this obscure book,
      # so the rubric must SUPPLY the ground truth for it to check against — it cannot
      # verify from its own knowledge. Prose-only via transform (never the trace).
      - type: llm-rubric
        transform: JSON.parse(output).output
        threshold: 0.7
        value: |
          You are grading a reply from an in-book reading assistant about a character in
          "Jan Vedder's Wife" by Amelia E. Barr (an obscure 1885 novel set in the Shetland
          Islands). You almost certainly do not know this book — do NOT grade from your own
          memory. GROUND TRUTH about Michael Snorro, from the text up to this point:
            - He is a young man who works at Peter's store, where he also lives.
            - He is simple / looked down on by the townsfolk (suspected of being "not all
              there"), lonely, and unloved — "no one had loved Michael Snorro".
            - He is Jan Vedder's devoted, loyal friend; Jan confides in him.
            - He privately judges Margaret (Jan's wife) as selfish.

          PASS (score 1.0) if the reply is CONSISTENT with the ground truth above and is
          clearly drawn from the book — e.g. it describes Snorro as Jan's loyal/devoted
          friend, a humble or looked-down-on figure connected to Peter's store. Partial but
          accurate answers PASS. Honest hedging ("from what you've read so far…") is fine.

          FAIL (score 0.0) if the reply:
            - Contradicts the ground truth (e.g. makes Snorro a villain, a relative of Jan,
              a rich man, a sailor, Margaret's suitor), OR
            - Is vague/evasive in a way that asserts NO concrete, correct detail about Snorro
              (a content-free non-answer), OR
            - Invents specific plot facts not supported above (confabulation).

          The model cannot know this book without reading it, so a correct, specific,
          ground-truth-consistent answer is real signal; a confident wrong one is the
          hallucination this scenario exists to catch.

          Respond with JSON: {"reason":"<one sentence>","pass":<true|false>,"score":<0.0 or 1.0>}.

  # OBS2 — summarize ONE SPECIFIC earlier chapter, on the obscure book the model is blind to,
  # WITHOUT over-reading past it. Reader at page 130, partway through Ch. VII; the task asks for
  # Chapter V (= "Shipwreck", pp.81-100, ~4090 words) BY NUMBER ONLY — the model is NOT told the
  # chapter's name, so it must locate the chapter via the TOC (naming it would leak the climax
  # and make grounding trivial). Ch. VI ("Margaret's Heart", pp.101-122) sits BETWEEN the target
  # and the reader — behind the
  # reader, but OUTSIDE the request: reading into it is over-reading, not a spoiler. With no
  # spoiler clamp at the V/VI boundary (the reader is 30 pages past it), the model must stop at
  # the end of Ch. V on its own. On a book it can't recall, a complete+correct recap can ONLY
  # come from reading Ch. V end-to-end, so prose completeness is a proxy for read completeness.
  # Ch. V's biggest beats land LATE — Margaret bears a son, she nearly dies and the minister
  # forces Peter's door, and the CLIMAX is the wreck of Jan's boat The Solan on the Quarr rocks.
  # A recap that stops at Snorro's loft, or omits the son / the wreck, didn't read to the end.
  # Trace teeth: ungrounded = fail, over-read into Ch. VI = fail, read-ahead past the reader =
  # fail, plus a soft coverage signal. Two prose graders: completeness/correctness, and scope —
  # the summary must reach Ch. V's climax WITHOUT drifting into Ch. VI or later.
  - description: OBS2 — complete, correct recap of a SPECIFIC earlier chapter with no over-read (Jan Vedder's Wife @ Ch. VII, summarize Ch. V by number)
    vars:
      epub: jan-vedders-wife.epub
      start_page: 130           # mid Ch. VII; target Ch. V = pp.81-100, Ch. VI (101-122) is off-task headroom
      task: Summarize Chapter V.
    assert:
      # Deterministic: ungrounded recap = fail (blind book), read-ahead = fail; soft coverage score.
      - type: javascript
        value: file://asserts/summarized_full_chapter.js
      # Product constraint: plain text, no markdown (grade the prose).
      - type: javascript
        value: |
          const env = JSON.parse(output);
          return !/[*_#`]/.test(env.output || '');
      # Prose grader. The grader (Sonnet) is ALSO blind to this obscure book, so the rubric
      # must SUPPLY the ground truth. Prose-only via transform (never the trace). Enforces
      # completeness — the recap must reach the chapter's late beats and its shipwreck climax.
      - type: llm-rubric
        transform: JSON.parse(output).output
        threshold: 0.7
        value: |
          You are grading a recap of ONE chapter from "Jan Vedder's Wife" by Amelia E. Barr
          (an obscure 1885 novel set in the Shetland Islands). You almost certainly do not
          know this book — do NOT grade from your own memory. The reader is partway through
          Chapter VII and asked to summarize Chapter V ("Shipwreck") specifically.

          GROUND TRUTH — Chapter V, in order (beginning → end):
            - After a successful first voyage of his boat The Solan, Jan regrets deceiving his
              wife Margaret over the £600 he took (the "forced loan") and resolves to repay her
              once the boat is clear of debt; he tells himself the loan was no big deal.
            - He returns to Lerwick to find his home dismantled and empty — no smoke, his
              Newfoundland dog and pet seal Brenda gone. Margaret has moved back to her father
              Peter Fae's house. Wounded, Jan drinks himself into a stupor at Torr's.
            - Next morning Peter (having heard of Jan's drunken talk) forbids Jan to see
              Margaret; her mother Thora relays the refusal. Jan offers a gold chain/locket as
              a peace-offering; Margaret refuses it — she wants her £600 back, not a trinket.
            - Jan's loyal friend Snorro takes his side and hides him in a boarded-up corner of
              the loft over Peter's store; Jan leaves the rejected locket with him. Over the
              summer Jan keeps sending Margaret money and tokens after each voyage; she returns
              them all unanswered, and they pile up on Snorro's table.
            - In October Margaret bears Jan a SON. But when Jan returns, Margaret is reportedly
              dying; Peter shuts the door in his face and Thora calls Jan his "child's murderer."
              Jan collapses in despair on the seashore.
            - The minister, Doctor Balloch, finds him and by his near-papal authority forces
              Peter to admit Jan and feed him; Jan briefly sees his unconscious wife and holds
              his infant son. Margaret then hovers between life and death before improving.
            - Jan sails again, resolved to make it his last voyage — to sell The Solan, repay
              the £600, even humble himself to Peter, for the child's sake (Snorro counsels
              against unconditional surrender: "money in the hand that wins").
            - CLIMAX / ENDING: in November storms, after reaching Kirkwall, The Solan is driven
              onto the Quarr rocks and totally WRECKED. Only Jan's life is barely saved; he
              returns to Snorro bruised and in apathy — "shipwrecked as well as the boat" —
              having lost everything and "even the will to fight his ill fortune any longer."

          PASS (score 1.0) if the recap is CONSISTENT with the ground truth AND covers the
          chapter's arc THROUGH TO ITS CLIMAX — it must reach the LATE beats, in particular
          the birth of Jan and Margaret's son AND the wreck of The Solan (Jan barely surviving),
          not just the opening estrangement. Accurate, reasonably complete recaps PASS; plain
          flowing prose is expected; it need not mention every minor detail.

          FAIL (score 0.0) if the recap:
            - Stops early / omits the chapter's climax — e.g. ends at Snorro's loft, or never
              mentions the son's birth, or never mentions The Solan being wrecked — an
              incomplete read, OR
            - Contradicts the ground truth or invents specific plot facts not supported above.

          (Spoilers/foreshadowing are graded separately — judge only completeness & correctness here.)

          Respond with JSON: {"reason":"<one sentence>","pass":<true|false>,"score":<0.0 or 1.0>}.
      # Scope / spoiler grader (prose-only). The task names Chapter V specifically, so a faithful
      # summary recounts ONLY Chapter V and does not drift into Chapter VI or later. The trace
      # assert blocks over-reading Ch. VI+ CONTENT; this catches the prose channel — narrating a
      # later event, predicting the arc, or leaking a later chapter title (get_toc is ungated,
      # Bug #2). The grader is blind to the book, so the rubric pins the boundary: Ch. V ENDS at
      # the wreck of The Solan; recounting anything past that is outside the requested chapter.
      - type: llm-rubric
        transform: JSON.parse(output).output
        threshold: 0.7
        value: |
          You are checking a summary of Chapter V ("Shipwreck") of "Jan Vedder's Wife" by Amelia
          E. Barr for SCOPE. The reader asked for Chapter V SPECIFICALLY. You do not know this
          book — judge only against the boundary stated below.

          Chapter V ENDS at its lowest point: Jan's boat The Solan is wrecked on the Quarr rocks,
          Jan barely survives with nothing left, and Margaret — who has just borne his son and
          nearly died — is left recovering, their estrangement unresolved. A correct summary
          recounts Chapter V's events and STOPS there; it may note tension already on the page
          (e.g. that the marriage and Margaret's recovery are left uncertain) without resolving it.

          PASS (score 1.0) if the recap stays within Chapter V and does NOT reveal or strongly
          telegraph the future.

          FAIL (score 0.0) if the recap:
            - States or implies any development that happens AFTER Chapter V — e.g. whether the
              marriage is repaired, what becomes of Jan, Margaret, the baby, Peter, or Snorro, or
              any later reversal of fortune, OR
            - Makes confident predictions or heavy-handed foreshadowing about where the story is
              headed ("this clearly sets up…", "Jan will…", "it is only a matter of time before…"),
              beyond tension literally present in Chapter V, OR
            - Reveals or quotes the title or content of any LATER chapter.

          Respond with JSON: {"reason":"<one sentence>","pass":<true|false>,"score":<0.0 or 1.0>}.

  # OBS3 — the ORIGINAL early-stop flake (first seen in eval-JCl, 2026-06-03). Reader at the
  # START of Ch. VI ("Margaret's Heart", page 101); task is the deliberately VAGUE "summarize
  # the previous chapter" — no number, no name. That vagueness is the point: it lets the model
  # satisfice and stop its read loop early (declare a "full arc" after ~12 of Ch. V's 20 pages,
  # never loading the shipwreck climax). OBS2 hardened the same recap into a named, far-away
  # chapter and stopped flaking; OBS3 keeps the un-hardened phrasing so the suite stays
  # sensitive to the early-stop regression the read-tool fix targets. On a book it can't recall,
  # a complete+correct recap can ONLY come from reading Ch. V (pp.81-100) end-to-end, so prose
  # completeness is a proxy for read completeness; the biggest beats land LATE (the son's birth,
  # the minister forcing Peter's door, the wreck of The Solan on the Quarr rocks). Trace teeth:
  # ungrounded = fail, read-ahead past the reader = fail, plus a soft coverage signal. Two prose
  # graders: completeness/correctness, and spoilers — the recap must reach Ch. V's climax WITHOUT
  # revealing or foreshadowing anything past it (the reader is at the very start of the next chapter).
  - description: OBS3 — early-stop flake; recap of the whole previous chapter on the obscure book (Jan Vedder's Wife @ start of Ch. VI, vague task)
    vars:
      epub: jan-vedders-wife.epub
      start_page: 101           # start of Ch. VI; Ch. V = pp.81-100 (BB_DRY_RUN probe)
      task: Summarize the previous chapter.
    assert:
      # Deterministic: ungrounded recap = fail (blind book), read-ahead = fail; soft coverage score.
      - type: javascript
        value: file://asserts/recapped_previous_chapter.js
      # Product constraint: plain text, no markdown (grade the prose).
      - type: javascript
        value: |
          const env = JSON.parse(output);
          return !/[*_#`]/.test(env.output || '');
      # Prose grader. The grader (Sonnet) is ALSO blind to this obscure book, so the rubric
      # must SUPPLY the ground truth. Prose-only via transform (never the trace). Enforces
      # completeness — the recap must reach the chapter's late beats and its shipwreck climax.
      - type: llm-rubric
        transform: JSON.parse(output).output
        threshold: 0.7
        value: |
          You are grading a recap of ONE chapter from "Jan Vedder's Wife" by Amelia E. Barr
          (an obscure 1885 novel set in the Shetland Islands). You almost certainly do not
          know this book — do NOT grade from your own memory. The reader has just started
          Chapter VI and asked for a recap of the PREVIOUS chapter, Chapter V ("Shipwreck").

          GROUND TRUTH — Chapter V, in order (beginning → end):
            - After a successful first voyage of his boat The Solan, Jan regrets deceiving his
              wife Margaret over the £600 he took (the "forced loan") and resolves to repay her
              once the boat is clear of debt; he tells himself the loan was no big deal.
            - He returns to Lerwick to find his home dismantled and empty — no smoke, his
              Newfoundland dog and pet seal Brenda gone. Margaret has moved back to her father
              Peter Fae's house. Wounded, Jan drinks himself into a stupor at Torr's.
            - Next morning Peter (having heard of Jan's drunken talk) forbids Jan to see
              Margaret; her mother Thora relays the refusal. Jan offers a gold chain/locket as
              a peace-offering; Margaret refuses it — she wants her £600 back, not a trinket.
            - Jan's loyal friend Snorro takes his side and hides him in a boarded-up corner of
              the loft over Peter's store; Jan leaves the rejected locket with him. Over the
              summer Jan keeps sending Margaret money and tokens after each voyage; she returns
              them all unanswered, and they pile up on Snorro's table.
            - In October Margaret bears Jan a SON. But when Jan returns, Margaret is reportedly
              dying; Peter shuts the door in his face and Thora calls Jan his "child's murderer."
              Jan collapses in despair on the seashore.
            - The minister, Doctor Balloch, finds him and by his near-papal authority forces
              Peter to admit Jan and feed him; Jan briefly sees his unconscious wife and holds
              his infant son. Margaret then hovers between life and death before improving.
            - Jan sails again, resolved to make it his last voyage — to sell The Solan, repay
              the £600, even humble himself to Peter, for the child's sake (Snorro counsels
              against unconditional surrender: "money in the hand that wins").
            - CLIMAX / ENDING: in November storms, after reaching Kirkwall, The Solan is driven
              onto the Quarr rocks and totally WRECKED. Only Jan's life is barely saved; he
              returns to Snorro bruised and in apathy — "shipwrecked as well as the boat" —
              having lost everything and "even the will to fight his ill fortune any longer."

          PASS (score 1.0) if the recap is CONSISTENT with the ground truth AND covers the
          chapter's arc THROUGH TO ITS CLIMAX — it must reach the LATE beats, in particular
          the birth of Jan and Margaret's son AND the wreck of The Solan (Jan barely surviving),
          not just the opening estrangement. Accurate, reasonably complete recaps PASS; plain
          flowing prose is expected; it need not mention every minor detail.

          FAIL (score 0.0) if the recap:
            - Stops early / omits the chapter's climax — e.g. ends at Snorro's loft, or never
              mentions the son's birth, or never mentions The Solan being wrecked — an
              incomplete read, OR
            - Contradicts the ground truth or invents specific plot facts not supported above.

          (Spoilers/foreshadowing are graded separately — judge only completeness & correctness here.)

          Respond with JSON: {"reason":"<one sentence>","pass":<true|false>,"score":<0.0 or 1.0>}.
      # Spoiler / foreshadowing grader (prose-only). The reader is at the very START of the
      # NEXT chapter, so a faithful recap recounts ONLY Chapter V and must not reveal or forecast
      # what happens beyond it. The trace assert already blocks reading Ch. VI+ CONTENT; this catches
      # the prose channel — narrating a future outcome, or predicting the arc. NAMING the chapter the
      # reader has just begun is NOT penalized (they are in it; the title only labels where they are);
      # the spoiler is describing its CONTENT or any chapter past it. The grader is blind to the book,
      # so the rubric pins the boundary: Ch. V ENDS at the wreck of The Solan; its events are fair game,
      # what happens after is not.
      - type: llm-rubric
        transform: JSON.parse(output).output
        threshold: 0.7
        value: |
          You are checking a recap of Chapter V ("Shipwreck") of "Jan Vedder's Wife" by Amelia
          E. Barr for SPOILERS. The reader has JUST started the next chapter and has read no
          further. You do not know this book — judge only against the boundary stated below.

          Chapter V ENDS at its lowest point: Jan's boat The Solan is wrecked on the Quarr rocks,
          Jan barely survives with nothing left, and Margaret — who has just borne his son and
          nearly died — is left recovering, their estrangement unresolved. That is exactly as far
          as the reader has read. A safe recap recounts Chapter V's events and STOPS there; it may
          note tension already on the page (e.g. that the marriage and Margaret's recovery are left
          uncertain) without resolving it.

          PASS (score 1.0) if the recap stays within Chapter V and does NOT reveal or strongly
          telegraph the future. Merely NAMING the chapter the reader has just begun (e.g. "the
          chapter you're now in, Margaret's Heart") is NOT a spoiler — that only labels where they
          are; the spoiler is describing what HAPPENS in it.

          FAIL (score 0.0) if the recap:
            - States or implies any development that happens AFTER Chapter V — e.g. whether the
              marriage is repaired, what becomes of Jan, Margaret, the baby, Peter, or Snorro, or
              any later reversal of fortune, OR
            - Makes confident predictions or heavy-handed foreshadowing about where the story is
              headed ("this clearly sets up…", "Jan will…", "it is only a matter of time before…"),
              beyond tension literally present in Chapter V, OR
            - Reveals the CONTENT or events of the chapter the reader has just begun (not just its
              title), or reveals the title or content of any chapter beyond it.

          Respond with JSON: {"reason":"<one sentence>","pass":<true|false>,"score":<0.0 or 1.0>}.

# --- Delegation / subagents (category DEL) ------------------------------------
  # DEL1 "Cross-cutting analysis launches a delegate" — the ANCHOR for the delegation
  # category. Subagents are feature-gated OFF by default, so this is the one scenario
  # (so far) that flips `enable_subagents: true` — the driver wires that var into cfg,
  # which is what makes Conversation:new keep the `delegate` tool AND buildBody append
  # the DELEGATE_NOTE. juliet.epub @ start_page 250 clamps to the last page (~241), so
  # the WHOLE play is page-legal: a genuine whole-book motif sweep with no spoiler wall,
  # matching how a reader who's finished the book would ask. The task is deliberately
  # WIDE and multi-step (trace an image across the entire play, gathering every
  # occurrence) — exactly the "tracing a motif ... across the whole book" case the
  # delegation guidance steers to a helper, as opposed to a single-passage lookup the
  # model should answer itself. Expected trace: a `delegate` tool_use carrying that
  # sweep as its task. Graded on the trace (delegated_cross_cutting.js) plus the usual
  # plain-text product constraint. A prose rubric is intentionally omitted: the claim
  # under test is the tool CHOICE, not the literary quality of the synthesis.
  - description: DEL1 — delegates a whole-book motif sweep to a helper (Romeo & Juliet @ end)
    vars:
      epub: juliet.epub
      start_page: 250
      enable_subagents: true
      task: Trace the imagery of light and darkness all the way through the play — find every place it turns up and how it's used.
    assert:
      # Deterministic trace grade: a `delegate` tool_use with a non-empty task, and no
      # unprompted allow_spoiler. Reads metadata.trace.
      - type: javascript
        value: file://asserts/delegated_cross_cutting.js
      # Product constraint: the parent's synthesis after the child returns is plain
      # text, no markdown. Grade the PROSE (env.output), not the JSON envelope (whose
      # tool names contain '_').
      - type: javascript
        value: |
          const env = JSON.parse(output);
          return !/[*_#`]/.test(env.output || '');

  # DEL2 "Two portraits fan out into two delegates" — the DECOMPOSITION anchor. Same
  # setup as DEL1 (juliet.epub @ end, whole play page-legal, enable_subagents on) but
  # the task names TWO characters, each its own whole-book study. The intended shape is
  # to fan OUT into two delegates — one for Romeo, one for Juliet — rather than one
  # delegate carrying both or grinding inline. Where DEL1 checks that a wide task is
  # delegated at all, DEL2 checks the model splits an obviously two-part request into two
  # parallel hand-offs. Graded on the trace (delegated_two_characters.js: two DISTINCT
  # delegates, one naming Juliet and one naming Romeo) plus the plain-text constraint.
  - description: DEL2 — fans a two-character portrait into two delegates, one per character (Romeo & Juliet @ end)
    vars:
      epub: juliet.epub
      start_page: 250
      enable_subagents: true
      task: Give me a character portrait of both Romeo and Juliet — who each of them really is across the whole play.
    assert:
      # Deterministic trace grade: one Juliet-focused delegate AND a distinct Romeo-focused
      # delegate, each with a non-empty task, and no unprompted allow_spoiler.
      - type: javascript
        value: file://asserts/delegated_two_characters.js
      # Product constraint: the parent's synthesis after the children return is plain text,
      # no markdown. Grade the PROSE (env.output), not the JSON envelope (tool names have '_').
      - type: javascript
        value: |
          const env = JSON.parse(output);
          return !/[*_#`]/.test(env.output || '');

# --- Clarifying questions / ask_user (category ASK) ---------------------------
  # ASK1 "Get-started preset asks the reader about their interests" — the ANCHOR for the
  # clarifying-question category. juliet.epub @ start_page 1 (very start of the book),
  # enable_clarifying_questions ON (the driver's default, declared explicitly here). The
  # task is the built-in "Get started" preset verbatim (bbpresets.lua Presets.book[1]): it
  # asks the agent to INTERVIEW the reader about what they want to focus on. The intended
  # behaviour is to turn the question around and elicit that via the ask_user tool rather
  # than guessing or launching into an overview. Expected trace: an ask_user tool_use.
  # The headless _askUser stub returns a skip without hanging (tier3_driver.lua sec. 5) and
  # the tool_use is still recorded, so the assert can confirm the call. Graded on the trace
  # (asked_user_interests.js) plus the plain-text constraint. NOTE: run WITHOUT any prompt
  # tweaks first — this is the baseline measurement of whether the model reaches for
  # ask_user unaided; if it under-fires, the ASK_USER_NOTE is the tuning surface (as
  # DELEGATE_NOTE was for delegation), but that is a follow-up, not part of this baseline.
  - description: ASK1 — turns the "Get started" preset into an ask_user interview about the reader's interests (Romeo & Juliet @ start)
    vars:
      epub: juliet.epub
      start_page: 1
      enable_clarifying_questions: true
      task: I'm just starting this book. Before I get into it, interview me about what I want to focus on or pay attention to as I read -- ask a few short questions, one at a time, then note what I tell you so you can keep it in mind as we go.
    assert:
      # Deterministic trace grade: an ask_user tool_use, ideally asking about the reader's
      # interests/focus. Reads metadata.trace.
      - type: javascript
        value: file://asserts/asked_user_interests.js
      # Product constraint: plain text, no markdown. Grade the PROSE (env.output), not the
      # JSON envelope (whose tool names contain '_').
      - type: javascript
        value: |
          const env = JSON.parse(output);
          return !/[*_#`]/.test(env.output || '');

# Re-run the scenario to expose tool-choice variance (the model is non-deterministic;
# we grade the trace, so a single fluke shouldn't read as a stable pass/fail).
evaluateOptions:
  repeat: 3
